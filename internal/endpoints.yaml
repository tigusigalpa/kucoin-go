# Source of truth for docs/ENDPOINTS.md — regenerate with:
#   go run ./internal/gendocs
#
# Every implemented SDK method must have exactly one row here. CI fails the
# build if docs/ENDPOINTS.md is out of date relative to this file.
endpoints:
  - method: "UTA.Market.GetInstruments"
    account_mode: "UTA"
    domain: "Market"
    http_method: "GET"
    path: "/api/ua/v1/market/instrument"
    access: "Public"
    permission: "None"
    status: "Supported"
    test: "uta/market/market_test.go: TestGetInstruments_SendsTradeTypeAndSymbol"
    doc_url: "https://www.kucoin.com/docs-new/rest/ua/get-symbol"

  - method: "UTA.Market.GetTickers"
    account_mode: "UTA"
    domain: "Market"
    http_method: "GET"
    path: "/api/ua/v1/market/ticker"
    access: "Public"
    permission: "None"
    status: "Supported"
    test: "uta/market/market_test.go: TestGetTickers_OmitsEmptySymbol"
    doc_url: "https://www.kucoin.com/docs-new/rest/ua/get-ticker"

  - method: "UTA.Market.GetOrderBook"
    account_mode: "UTA"
    domain: "Market"
    http_method: "GET"
    path: "/api/ua/v1/market/orderbook"
    access: "Private (confirmed by a live call; see models.OrderBook docblock)"
    permission: "General"
    status: "Supported"
    test: "uta/market/market_test.go: TestGetOrderBook_DecodesBidsAndAsks"
    doc_url: "https://www.kucoin.com/docs-new/rest/ua/get-orderbook"

  - method: "UTA.Market.GetKlines"
    account_mode: "UTA"
    domain: "Market"
    http_method: "GET"
    path: "/api/ua/v1/market/kline"
    access: "Public"
    permission: "None"
    status: "Supported"
    test: "uta/market/market_test.go: TestGetKlines_DecodesArrayFormat, TestKline_UnmarshalJSON_RoundTrip"
    doc_url: "https://www.kucoin.com/docs-new/rest/ua/get-klines"

  - method: "UTA.Market.GetTrades"
    account_mode: "UTA"
    domain: "Market"
    http_method: "GET"
    path: "/api/ua/v1/market/trade"
    access: "Public"
    permission: "None"
    status: "Supported"
    test: "uta/market/market_test.go: TestGetTrades"
    doc_url: "https://www.kucoin.com/docs-new/rest/ua/get-trades"

  - method: "UTA.Market.GetCurrencies"
    account_mode: "UTA"
    domain: "Market"
    http_method: "GET"
    path: "/api/ua/v1/asset/currencies"
    access: "Public"
    permission: "None"
    status: "Supported"
    test: "uta/market/market_test.go: TestGetCurrencies_SendsFilters"
    doc_url: "https://www.kucoin.com/docs-new/rest/ua/get-currencies"

  - method: "UTA.Market.GetCurrency"
    account_mode: "UTA"
    domain: "Market"
    http_method: "GET"
    path: "/api/ua/v1/market/currency"
    access: "Public"
    permission: "None"
    status: "Supported"
    test: "uta/market/market_test.go: TestGetCurrency_SingleLookup"
    doc_url: "https://www.kucoin.com/docs-new/rest/ua/get-currency"

  - method: "UTA.Market.GetServiceStatus"
    account_mode: "UTA"
    domain: "Market"
    http_method: "GET"
    path: "/api/ua/v1/server/status"
    access: "Public"
    permission: "None"
    status: "Supported"
    test: "uta/market/market_test.go: TestGetServiceStatus"
    doc_url: "https://www.kucoin.com/docs-new/rest/ua/get-service-status"

  - method: "UTA.Market.GetAnnouncements"
    account_mode: "UTA"
    domain: "Market"
    http_method: "GET"
    path: "/api/ua/v1/market/announcement"
    access: "Public"
    permission: "None"
    status: "Supported"
    test: "uta/market/market_test.go: TestGetAnnouncements_SendsPaginationParams"
    doc_url: "https://www.kucoin.com/docs-new/rest/ua/get-announcements"

  - method: "UTA.Market.GetTradeStatistics"
    account_mode: "UTA"
    domain: "Market"
    http_method: "GET"
    path: "/api/ua/v1/trade-statistics"
    access: "Public"
    permission: "None"
    status: "Supported"
    test: "uta/market/market_test.go: TestGetTradeStatistics"
    doc_url: "https://www.kucoin.com/docs-new/rest/ua/get-trade-statistics"

abandoned: []
