  - session: "Classic.Futures.Stream"
    method: "SubscribeTickerV2"
    account_mode: "Classic"
    market: "Futures"
    access: "Public"
    topic: "/contractMarket/tickerV2:{symbol}"
    payload: "TickerV2"
    status: "Supported"
    test: "classic/futures/streaming/session_test.go: TestTickerV2"
    doc_url: "https://www.kucoin.com/docs-new/3470080w0"

