# Source of truth for docs/CHANNELS.md — regenerate with:
#   go run ./internal/gendocs
#
# One row per typed WebSocket subscribe method of a streaming Session. The
# manifest tests (manifest_test.go) fail the build when a row does not resolve to
# a real method on kucoin.Client, when its test reference does not exist, or when
# a Subscribe* method exists without a row.
channels:
